name: Assignment 2 native validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: assignment-2
    env:
      JAX_PLATFORM_NAME: cpu
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      IMAGEIO_FFMPEG_NO_PREVENT_SIGINT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements-lock.txt'
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=artifacts/ci-tests.xml
      - run: python src/train.py --map 3 --randomize --route-reward --parking-reward --envs 4 --rollout 16 --max-steps 48 --updates 1 --epochs 1 --minibatches 1 --output artifacts/ci-training
      - run: python src/ci_check.py
      - run: python src/evaluation_suite.py --final-only --episodes 16 --map2-episodes 64 --map2-seed 61000 --output artifacts/ci-evaluation
      - run: python src/make_rl_video.py --maps 3 2 --output artifacts/ci-video.mp4
      - run: python src/verify_video.py artifacts/ci-video.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment2-${{ matrix.os }}
          path: |
            assignment-2/artifacts/ci-evaluation/
            assignment-2/artifacts/ci-quality.json
            assignment-2/artifacts/ci-tests.xml
            assignment-2/artifacts/ci-video*
            assignment-2/artifacts/ci-training/
