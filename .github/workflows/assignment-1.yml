name: Assignment 1 CPU checks
on:
  push:
    branches: [Submission]
    paths:
      - 'assignment-1/src/**'
      - 'assignment-1/tests/**'
      - 'assignment-1/examples/**'
      - 'assignment-1/requirements*.txt'
      - 'assignment-1/pytest.ini'
      - '.github/workflows/assignment-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: assignment-1
    env:
      JAX_PLATFORM_NAME: cpu
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      IMAGEIO_FFMPEG_NO_PREVENT_SIGINT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: assignment-1/requirements-lock.txt
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-lock.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Unit and integration tests
        run: python -m pytest -q --junitxml=ci-results/tests.xml
      - name: 32 scenario regression cases
        run: python src/scenarios.py --output ci-results/scenarios.json
      - name: Observation-only RL interface smoke test
        run: python examples/rl_smoke.py
      - name: Offscreen renderer and H264 encoder
        run: python src/main.py --map 3 --demo --headless --max-steps 8 --record ci-results/smoke.mp4
      - name: Decode exported video
        run: python -c "import imageio.v2 as i; r=i.get_reader('ci-results/smoke.mp4'); assert r.get_data(0).shape == (800,1280,3); r.close()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-1-${{ matrix.os }}
          path: assignment-1/ci-results/
